name: Build Test Installer Release

on:
  pull_request:
  push:
    branches:
      - master
      - update-dlls-improve-analytics
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: read
  checks: write

env:
  Configuration: Release

jobs:
  build_test:
    name: Build Test Installer Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: true

      # No separate GitVersion action is needed: GitVersion.MsBuild is already a PackageReference
      # in Glyssen.csproj and the other packable/versioned projects, so GitVersion_Semver /
      # GitVersion_MajorMinorPatch etc. get computed automatically as part of each msbuild
      # invocation below (as long as the checkout above has full history and tags).

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Restore NuGet packages
        run: nuget restore Glyssen.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild build\Glyssen.proj /t:Build /p:Configuration=$env:Configuration /m

      - name: Run Tests
        run: msbuild build\Glyssen.proj /t:Test /p:Configuration=$env:Configuration /m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glyssen-test-results
          if-no-files-found: warn
          path: output/${{ env.Configuration }}/TestResults.xml

      - name: Create HTML release notes
        run: msbuild build\Glyssen.proj /t:ConvertReleaseNotesToHtml /p:Configuration=$env:Configuration

      - name: Build installer
        run: msbuild build\Glyssen.proj /t:Installer /p:Configuration=$env:Configuration /m

      - name: Sign installer
        if: ${{ github.event_name != 'pull_request' }}
        uses: sillsdev/codesign/trusted-signing-action@v3
        with:
          credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
          files-folder: output/installer
          files-folder-filter: GlyssenInstaller*.exe

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: glyssen-installer
          if-no-files-found: error
          path: |
            output/installer/GlyssenInstaller*.exe
            output/installer/*.download_info
            output/installer/appcast.xml
            output/releasenotes.download_info
            output/ReleaseNotes.htm

      - name: Create release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/installer/GlyssenInstaller*.exe
            output/installer/*.download_info
            output/installer/appcast.xml
            output/releasenotes.download_info
            output/ReleaseNotes.htm
          draft: true
          generate_release_notes: true

      - name: Pack NuGet packages
        run: msbuild build\Glyssen.proj /t:Pack /p:Configuration=$env:Configuration /m

      # You might want to test out the PR packages, but the release should be pulled from nuget
      - name: Upload NuGet package artifacts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: glyssen-nuget-packages
          if-no-files-found: warn
          path: |
            output/*.nupkg
            output/*.snupkg

      # When refreshing the Nuget publishing token, make sure it covers the Glyssen packages
      - name: Publish NuGet packages
        if: ${{ github.event_name == 'push' }}
        run: dotnet nuget push output/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.SILLSDEV_PUBLISH_NUGET_ORG }} --skip-duplicate

  report:
    name: Test Report
    needs: build_test
    runs-on: ubuntu-latest
    steps:
    - uses: dorny/test-reporter@v3
      with:
        artifact: glyssen-test-results
        name: NUnit Tests
        path: '*.xml'
        reporter: dotnet-nunit
