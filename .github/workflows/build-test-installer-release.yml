name: Build Test Installer Release

on:
  pull_request:
  push:
    branches:
      - master
      - update-dlls-improve-analytics
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: read
  checks: write

env:
  Configuration: Release

jobs:
  build_test:
    name: Build Test Installer Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: true

      # The GitVersion.MsBuild PackageReference in Glyssen.csproj (etc.) only computes
      # GitVersion_Semver / GitVersion_MajorMinorPatch within that child project's own build;
      # those properties don't flow back to this wrapper project (build\Glyssen.proj), which
      # evaluates its own $(GitVersion_Semver)/$(GitVersion_MajorMinorPatch) references before
      # any child project builds. So, as AppVeyor did via its own `gitversion` before_build step,
      # compute the version once here and expose it as environment variables that the wrapper
      # picks up for the installer filename, WiX product version, and release notes.
      - name: Determine version
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.12.0
          $env:GITVERSION_BUILD_NUMBER = "${{ github.run_number }}"
          dotnet-gitversion /output buildserver /nonormalize

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Restore NuGet packages
        run: nuget restore Glyssen.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild build\Glyssen.proj /t:Build /p:Configuration=$env:Configuration /m

      - name: Run Tests
        # ExtraExcludeCategories=SkipInCI mirrors what TeamCity (via the auto-set
        # teamcity_version property) and AppVeyor (via its own ExtraExcludeCategories env var)
        # both did: it excludes the handful of NUnit "tests" that are really utility methods
        # requiring local-only FCBH-SIL audio data that isn't available in CI.
        run: msbuild build\Glyssen.proj /t:Test /p:Configuration=$env:Configuration /p:ExtraExcludeCategories=SkipInCI /m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glyssen-test-results
          if-no-files-found: warn
          path: output/${{ env.Configuration }}/TestResults.xml

      - name: Create HTML release notes
        run: msbuild build\Glyssen.proj /t:ConvertReleaseNotesToHtml /p:Configuration=$env:Configuration

      - name: Build installer
        run: msbuild build\Glyssen.proj /t:Installer /p:Configuration=$env:Configuration /m

      - name: Sign installer
        if: ${{ github.event_name != 'pull_request' }}
        uses: sillsdev/codesign/trusted-signing-action@v3
        with:
          credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
          files-folder: output/installer
          files-folder-filter: GlyssenInstaller*.exe

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: glyssen-installer
          if-no-files-found: error
          path: |
            output/installer/GlyssenInstaller*.exe
            output/installer/*.download_info
            output/installer/appcast.xml
            output/releasenotes.download_info
            output/ReleaseNotes.htm
            DistFiles/ReleaseNotes.md

      - name: Create release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/installer/GlyssenInstaller*.exe
            output/installer/*.download_info
            output/installer/appcast.xml
            output/releasenotes.download_info
            output/ReleaseNotes.htm
          draft: true
          generate_release_notes: true

      - name: Pack NuGet packages
        run: msbuild build\Glyssen.proj /t:Pack /p:Configuration=$env:Configuration /m

      # We always pack, but only push events publish to nuget.org. PR builds upload the
      # packages as workflow artifacts so they can be downloaded and tested without being
      # published.
      - name: Upload NuGet package artifacts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: glyssen-nuget-packages
          if-no-files-found: error
          path: |
            output/*.nupkg
            output/*.snupkg

      # When refreshing the Nuget publishing token, make sure it covers the Glyssen packages
      - name: Publish NuGet packages
        if: ${{ github.event_name == 'push' }}
        run: dotnet nuget push output/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.SILLSDEV_PUBLISH_NUGET_ORG }} --skip-duplicate

  # Publishes the installer and appcast to the stable public mirror that both the appcast's
  # own <enclosure> URL and MainForm.cs's update-checker point at, decoupling distribution
  # from whichever CI system happens to build a given release. Runs on ubuntu-latest rather
  # than windows-latest because windows-latest's bundled OpenSSH client is too old to
  # negotiate a key exchange algorithm this server offers (confirmed via a failed
  # ssh-keyscan); Ubuntu's OpenSSH build has no such problem.
  publish_to_software_sil_org:
    name: Publish to software.sil.org
    needs: build_test
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          name: glyssen-installer

      - name: Upload to software.sil.org
        env:
          SFTP_PRIVATE_KEY: ${{ secrets.GLYSSEN_SFTP_PRIVATE_KEY }}
          SFTP_PASSPHRASE: ${{ secrets.GLYSSEN_SFTP_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SFTP_PRIVATE_KEY" > ~/.ssh/gha_glyssen
          chmod 600 ~/.ssh/gha_glyssen
          # Strip the passphrase from this throwaway copy of the key, since it only needs
          # to exist for the lifetime of this job and sftp has no non-interactive way to
          # supply a passphrase without the added complexity of ssh-agent/SSH_ASKPASS.
          ssh-keygen -p -P "$SFTP_PASSPHRASE" -N "" -f ~/.ssh/gha_glyssen
          # Host key fingerprint confirmed independently with TechOps (SIL) rather than
          # trusted on first connect.
          echo "software.sil.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJwY1f1tshznQKx9dc5CDFaZnan3s1quy6i0up1h9wUL" >> ~/.ssh/known_hosts
          sftp -i ~/.ssh/gha_glyssen -o StrictHostKeyChecking=yes -b - gha_glyssen@software.sil.org << 'SFTP_COMMANDS'
          cd upload_areas/glyssen
          put output/installer/GlyssenInstaller*.exe
          put output/installer/*.download_info
          put output/installer/appcast.xml
          put output/releasenotes.download_info
          put output/ReleaseNotes.htm
          put DistFiles/ReleaseNotes.md
          SFTP_COMMANDS

  report:
    name: Test Report
    needs: build_test
    runs-on: ubuntu-latest
    steps:
    - uses: dorny/test-reporter@v3
      with:
        artifact: glyssen-test-results
        name: NUnit Tests
        path: '*.xml'
        reporter: dotnet-nunit
