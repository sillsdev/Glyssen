name: Build Test Installer Release

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: read
  checks: write

env:
  Configuration: Release

jobs:
  build_test:
    name: Build Test Installer Release
    runs-on: windows-latest
    outputs:
      nuget_published: ${{ steps.publish_nuget.outcome == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: true

      # The GitVersion.MsBuild PackageReference in Glyssen.csproj (etc.) only computes
      # GitVersion_Semver / GitVersion_MajorMinorPatch within that child project's own build;
      # those properties don't flow back to this wrapper project (build\Glyssen.proj), which
      # evaluates its own $(GitVersion_Semver)/$(GitVersion_MajorMinorPatch) references before
      # any child project builds. So, as AppVeyor did via its own `gitversion` before_build step,
      # compute the version once here and expose it as environment variables that the wrapper
      # picks up for the installer filename, WiX product version, and release notes.
      - name: Determine version
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.12.0
          $env:GITVERSION_BUILD_NUMBER = "${{ github.run_number }}"
          dotnet-gitversion /output buildserver /nonormalize

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Restore NuGet packages
        run: nuget restore Glyssen.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild build\Glyssen.proj /t:Build /p:Configuration=$env:Configuration /m

      - name: Run Tests
        # ExtraExcludeCategories=SkipInCI mirrors what TeamCity (via the auto-set
        # teamcity_version property) and AppVeyor (via its own ExtraExcludeCategories env var)
        # both did: it excludes the handful of NUnit "tests" that are really utility methods
        # requiring local-only FCBH-SIL audio data that isn't available in CI.
        run: msbuild build\Glyssen.proj /t:Test /p:Configuration=$env:Configuration /p:ExtraExcludeCategories=SkipInCI /m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glyssen-test-results
          if-no-files-found: warn
          path: output/${{ env.Configuration }}/TestResults.xml

      - name: Create HTML release notes
        run: msbuild build\Glyssen.proj /t:ConvertReleaseNotesToHtml /p:Configuration=$env:Configuration

      # Installer.wixproj pulls in the SIL.Installer package via PackageReference, but it's a
      # classic (non-SDK) project that isn't part of Glyssen.sln, so the "Restore NuGet packages"
      # step above never restores it. Unlike SDK-style projects, it also doesn't auto-restore on
      # build, so without this step the installer build fails with LGHT0094 ("Unresolved
      # reference to symbol 'WixComponentGroup:SilAnalyticsComponents'") because the package's
      # Analytics.wxs fragment was never extracted.
      - name: Restore Installer NuGet packages
        run: msbuild Installer\Installer.sln /t:restore

      - name: Build installer
        run: msbuild build\Glyssen.proj /t:Installer /p:Configuration=$env:Configuration /m

      - name: Sign installer
        if: ${{ github.event_name != 'pull_request' }}
        uses: sillsdev/codesign/trusted-signing-action@v3
        with:
          credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
          files-folder: output/installer
          files-folder-filter: GlyssenInstaller*.exe

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: glyssen-installer
          if-no-files-found: error
          path: |
            output/installer/GlyssenInstaller*.exe
            output/installer/*.download_info
            output/installer/appcast.xml
            output/releasenotes.download_info
            output/ReleaseNotes.htm
            DistFiles/ReleaseNotes.md

      - name: Create release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/installer/GlyssenInstaller*.exe
            output/installer/*.download_info
            output/installer/appcast.xml
            output/releasenotes.download_info
            output/ReleaseNotes.htm
          draft: true
          generate_release_notes: true

      - name: Pack NuGet packages
        run: msbuild build\Glyssen.proj /t:Pack /p:Configuration=$env:Configuration /m

      # We always pack, but only push events publish to nuget.org. PR builds upload the
      # packages as workflow artifacts so they can be downloaded and tested without being
      # published.
      - name: Upload NuGet package artifacts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: glyssen-nuget-packages
          if-no-files-found: error
          path: |
            output/*.nupkg
            output/*.snupkg

      # Uses nuget.org's Trusted Publishing (OIDC), which requires a Trusted Publishing policy
      # on the nuget.org "sil-lsdev" account (the owner of the Glyssen packages) matching this
      # exact repo/workflow file:
      #   Repository owner: sillsdev | Repository: Glyssen
      #   Workflow file: build-test-installer-release.yml | Environment: (blank)
      # "sil-lsdev" below is just that account's public nuget.org profile name, not a secret.
      #
      # TEMPORARY: continue-on-error and the warning step below are a stopgap until that policy
      # is confirmed set up and working. Until then, login will fail with "no matching policy"
      # and the packages won't be published, but the installer release itself still succeeds.
      # Remove continue-on-error (on both steps) and the warning step once that's confirmed.
      - name: NuGet login (OIDC -> temporary API key)
        id: nuget_login
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: sil-lsdev

      - name: Publish NuGet packages
        id: publish_nuget
        if: ${{ github.event_name == 'push' && steps.nuget_login.outcome == 'success' }}
        continue-on-error: true
        run: dotnet nuget push output\*.nupkg --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Warn if NuGet publish failed (branch build)
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') && (steps.nuget_login.outcome == 'failure' || steps.publish_nuget.outcome == 'failure') }}
        run: echo "::warning::Publishing NuGet packages failed (see the 'NuGet login'/'Publish NuGet packages' steps above). This is currently non-blocking while the nuget.org Trusted Publishing policy is being set up, so the build still succeeded, but the NuGet packages were NOT updated for this version."

      - name: Warn if NuGet publish failed (release build)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && (steps.nuget_login.outcome == 'failure' || steps.publish_nuget.outcome == 'failure') }}
        run: echo "::warning::Publishing NuGet packages failed for this release. The installer build, signing, and draft GitHub release still succeeded, but the automatic publish to software.sil.org was skipped since this is a tagged release. To publish to software.sil.org anyway, manually run the 'Publish installer to software.sil.org' workflow with run_id=${{ github.run_id }}."

  # See publish-software-sil-org.yml for what this does. Only runs for tag builds, and only
  # when NuGet publishing succeeded; see the 'Warn if NuGet publish failed (release build)' step
  # above for how to publish anyway when that's not the case.
  publish_to_software_sil_org:
    name: Publish to software.sil.org
    needs: build_test
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.build_test.outputs.nuget_published == 'true' }}
    uses: ./.github/workflows/publish-software-sil-org.yml
    secrets: inherit

  report:
    name: Test Report
    needs: build_test
    runs-on: ubuntu-latest
    steps:
    - uses: dorny/test-reporter@v3
      with:
        artifact: glyssen-test-results
        name: NUnit Tests
        path: '*.xml'
        reporter: dotnet-nunit
